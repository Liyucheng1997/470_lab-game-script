<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地下城军师</title>
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="lg-backdrop" id="backdrop"></div>
<div class="lg-frame"></div>

<header class="top pywebview-drag-region">
  <div class="brand pywebview-drag-region"><span class="dot" id="dot"></span><b>地下城军师</b><span class="status" id="status">等游戏</span></div>
  <div class="win">
    <button class="lg-pill icon" title="重新加载（载入最新修改）" data-act="reload">↻</button>
    <button class="lg-pill icon" title="隐藏（F10）" data-act="hide">–</button>
    <button class="lg-pill icon" title="退出" data-act="quit">✕</button>
  </div>
</header>

<div class="controls">
  <div class="lg-seg" id="seg-mode"><span class="thumb"></span><button data-v="advise">推荐</button><button data-v="auto">自动玩</button></div>
  <div class="lg-seg" id="seg-style"><span class="thumb"></span><button data-v="爽">爽</button><button data-v="稳">稳</button></div>
  <button class="lg-pill" data-act="ask-now" title="带着当前画面问 AI（F6）">✦ 问 AI</button>
</div>

<main id="main"></main>

<footer class="ask">
  <input class="lg-input" id="ask" placeholder="问点什么，回车（如：这把出什么装）" autocomplete="off">
</footer>

<script src="app.js"></script>
</body>
</html>
